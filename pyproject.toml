[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goml-data-engineering-pipeline"
version = "1.0.0"
description = "Local goML medallion data engineering case study"
requires-python = ">=3.10"
dependencies = ["duckdb==1.2.2", "pydantic[email]==2.10.6", "streamlit==1.65.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.9.10"]

[project.scripts]
goml-pipeline = "goml_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
